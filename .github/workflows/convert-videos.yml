name: Convert Videos

on:
  push:
    paths:
      - "docs/videos/**"
      - ".github/workflows/convert-videos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-videos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert source videos and clean orphaned derivatives
        id: convert
        shell: bash
        run: |
          shopt -s nullglob

          changed=false
          source_ext_regex='(mov|m4v|avi|mkv)'

          for source in docs/videos/*; do
            [ -f "$source" ] || continue

            ext="${source##*.}"
            ext="${ext,,}"

            case "$ext" in
              mp4|webm)
                continue
                ;;
              mov|m4v|avi|mkv)
                base="${source%.*}"
                mp4="${base}.mp4"
                webm="${base}.webm"

                if [ ! -f "$mp4" ] || [ "$source" -nt "$mp4" ]; then
                  ffmpeg -y -i "$source" \
                    -c:v libx264 \
                    -preset medium \
                    -crf 23 \
                    -movflags +faststart \
                    -pix_fmt yuv420p \
                    -c:a aac \
                    -b:a 128k \
                    "$mp4"
                  changed=true
                fi

                if [ ! -f "$webm" ] || [ "$source" -nt "$webm" ]; then
                  ffmpeg -y -i "$source" \
                    -c:v libvpx-vp9 \
                    -crf 32 \
                    -b:v 0 \
                    -row-mt 1 \
                    -c:a libopus \
                    -b:a 128k \
                    "$webm"
                  changed=true
                fi
                ;;
            esac
          done

          for derived in docs/videos/*.{mp4,webm}; do
            [ -f "$derived" ] || continue

            base="${derived%.*}"
            has_source=false

            for ext in mov m4v avi mkv; do
              if [ -f "${base}.${ext}" ] || [ -f "${base}.${ext^^}" ]; then
                has_source=true
                break
              fi
            done

            if [ "$has_source" = false ]; then
              rm -f "$derived"
              changed=true
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push converted videos
        if: steps.convert.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: convert videos for browser compatibility [skip ci]"
          file_pattern: "docs/videos/*.mp4 docs/videos/*.webm"
