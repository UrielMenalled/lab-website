name: Optimize Images

on:
  push:
    paths:
      - "docs/images/**"
      - "scripts/compress_images.py"
      - ".github/workflows/compress-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow

      - name: Collect changed source images
        id: changed-images
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only HEAD^ HEAD -- 'docs/images/*' \
            | grep -E '\.(jpg|jpeg|png)$' \
            | grep -Ev '(^|/).*-mobile\.(jpg|jpeg|png)$' \
            | tr '\n' ' ' \
            | sed 's/[[:space:]]*$//' || true)

          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "run_all=false" >> "$GITHUB_OUTPUT"

      - name: Optimize images and generate mobile variants
        if: steps.changed-images.outputs.run_all == 'true' || steps.changed-images.outputs.files != ''
        shell: bash
        run: |
          if [ "${{ steps.changed-images.outputs.run_all }}" = "true" ]; then
            python scripts/compress_images.py
          else
            python scripts/compress_images.py ${{ steps.changed-images.outputs.files }}
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: optimize images and generate mobile variants"
          file_pattern: "docs/images/*"
